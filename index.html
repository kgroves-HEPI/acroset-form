    <main>
      <section id="inputPanel" class="card one-col">
        <div class="col">
          <form id="data-form" class="fill">

              <div>
                <label>Date</label
                ><input
                  type="text"
                  id="date"
                  name="date"
                  placeholder="MM/DD/YYYY"

                ><input name="mechanic" placeholder="Name" required />
              </div>
              <div>
                <label>WO#</label
                ><input name="wo" placeholder="e.g., 12345" required />
              </div>
              <div>
                <label>Location</label>
                <select name="location" required>
                  <option value="" disabled selected>Select...</option>
                  <option>Billings</option>
                  <option>Leduc</option>
                </select>
              </div>

                <label>Model</label>

                  <option value="797 Front">797 Front</option>
                  <option value="830E Front">830E Front</option>
                  <option value="930E Front">930E Front</option>
                </select>
              </div>

                <label>Measured Retainer Thickness (in)</label>

                  name="retainer"
                  type="number"
                  step="any"
                  placeholder="e.g., 1.500"
                  required
                />
              </div>
